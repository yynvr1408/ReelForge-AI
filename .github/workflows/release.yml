name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag's version MUST match apps/desktop/package.json's "version"
# field (Squirrel's update feed keys off that version) — see
# docs/releases/release-process.md.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck and lint
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm run lint

      # electron-forge's prePackage hook freezes the processing service
      # with PyInstaller into a self-contained exe bundled into the
      # release — see docs/releases/release-process.md.
      - name: Install processing-service build dependencies
        working-directory: services/processing
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e ".[build]"

      - name: Verify tag matches package.json version
        working-directory: apps/desktop
        shell: bash
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Build and publish to GitHub Releases
        working-directory: apps/desktop
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
