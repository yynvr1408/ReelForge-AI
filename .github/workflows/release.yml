name: Release

# Publishes a Windows release: push a version tag (e.g. git tag v0.2.0 && git push origin v0.2.0)
# or run via workflow_dispatch in GitHub Actions.
#
# This builds the installer and publishes it to the SEPARATE public release repository:
#   yynvr1408/reelforge-ai-releases
# (matching apps/desktop/forge.config.mts publisher config) - never cluttering this source repo.
#
# To publish from this private/source repo to the separate releases repo:
#   1. Create the releases repo: yynvr1408/reelforge-ai-releases
#   2. Create a GitHub Personal Access Token (PAT) with "Contents: Read and write" access
#      scoped to yynvr1408/reelforge-ai-releases (Settings > Developer settings > Personal access tokens).
#   3. Add it as a secret named RELEASES_TOKEN on THIS repo (Settings > Secrets and variables > Actions).
# When RELEASES_TOKEN is set, it publishes directly to the separate releases repo.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create release as draft"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck and lint
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm run lint

      # electron-forge's prePackage hook freezes the processing service
      # with PyInstaller into a self-contained exe bundled into the
      # release — see docs/releases/release-process.md.
      - name: Install processing-service build dependencies
        working-directory: services/processing
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e ".[build]"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        shell: bash
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Build and publish to GitHub Releases
        working-directory: apps/desktop
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
