[project]
name = "reelforge-processing"
version = "0.1.0"
description = "ReelForge AI local processing service (media analysis, timeline planning, rendering)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<2.1",
    "scenedetect>=0.6.4,<0.7",
    "opencv-python-headless>=4.10,<4.11",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.28",
]
build = [
    "pyinstaller>=6.22,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
